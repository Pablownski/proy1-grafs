[package]
name = "Maze-raycast"
version = "0.1.0"
edition = "2024"

[dependencies]
minifb = "0.28"
rodio = "0.19"
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
